<polyline fill="none" points="476,118 1160,84" stroke="#1baf7a" stroke-dasharray="14 8" stroke-width="5"/>
<polyline fill="none" points="476,182 1160,216" stroke="#1baf7a" stroke-dasharray="14 8" stroke-width="5"/>
