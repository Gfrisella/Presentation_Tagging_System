<svg aria-label="Top view of SHiP from the target to the timing detector: target, muon shield MHS and MS1 to MS7 with the SD inside MS5 and MS6, UBT at the decay-volume entrance, helium decay volume surrounded by the SBT, spectrometer straw tracker stations T1 to T4 around the dipole magnet, timing detector, calorimeters and muon detector" height="300.0" role="img" style="font-family:'Source Sans Pro'" viewBox="0 0 1500 300" width="1500.0" xmlns="http://www.w3.org/2000/svg">
<line stroke="#d6dce5" stroke-dasharray="4 6" x1="20" x2="1480" y1="150" y2="150"/>
<!-- target -->
<rect fill="#1c2330" height="24" width="22" x="30" y="138"/>
<text fill="#1c2330" font-size="19" x="14" y="232">target</text><line stroke="#1c2330" stroke-width="1.5" x1="41" x2="41" y1="164" y2="214"/>
