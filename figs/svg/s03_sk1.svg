<text fill="#5a6474" font-size="13" text-anchor="middle" x="177" y="90">MS2</text>
<rect fill="#c9d1dc" height="92" stroke="#9aa6b6" width="42" x="204" y="104.0"/>
<text fill="#5a6474" font-size="13" text-anchor="middle" x="225" y="94">MS3</text>
<rect fill="#c9d1dc" height="100" stroke="#9aa6b6" width="42" x="252" y="100.0"/>
<text fill="#5a6474" font-size="13" text-anchor="middle" x="273" y="90">MS4</text>
<rect fill="#c9d1dc" height="92" stroke="#9aa6b6" width="42" x="300" y="104.0"/>
<text fill="#5a6474" font-size="13" text-anchor="middle" x="321" y="94">MS5</text>
<rect fill="#c9d1dc" height="100" stroke="#9aa6b6" width="42" x="348" y="100.0"/>
<text fill="#5a6474" font-size="13" text-anchor="middle" x="369" y="90">MS6</text>
<rect fill="#c9d1dc" height="92" stroke="#9aa6b6" width="42" x="396" y="104.0"/>
<text fill="#5a6474" font-size="13" text-anchor="middle" x="417" y="94">MS7</text>
<rect fill="#d55e00" fill-opacity="0.35" height="64" stroke="#d55e00" stroke-width="2" width="69" x="321" y="118"/>
<text fill="#8a3a00" font-size="16" font-weight="700" text-anchor="middle" x="355" y="156">SD</text>
<text fill="#5a6474" font-size="19" text-anchor="middle" x="260" y="232">muon shield: MHS + MS1–MS7</text>
<text fill="#b34700" font-size="14" text-anchor="middle" x="355" y="214">SD: 5 m, mid-MS5 → end of MS6</text>
<!-- decay volume -->
<polygon fill="#f2f5f9" points="468,128 1160,95 1160,205 468,172" stroke="#0053a1" stroke-width="2.5"/>
<text fill="#0053a1" font-size="20" text-anchor="middle" x="814" y="156">Decay Volume (DV): He balloon, PVC walls</text>
