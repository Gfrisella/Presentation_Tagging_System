<line stroke="#5a6474" x1="30" x2="1160" y1="285" y2="285"/>
<g fill="#5a6474" font-size="15" text-anchor="middle">
<line stroke="#5a6474" x1="30" x2="30" y1="280" y2="290"/><text x="30" y="300">0</text>
<line stroke="#5a6474" x1="468" x2="468" y1="280" y2="290"/><text x="468" y="300">31.13 m</text>
<line stroke="#5a6474" x1="1160" x2="1160" y1="280" y2="290"/><text x="1160" y="300">81.13 m</text>
<text x="1320" y="300">SST1 82.08 m · TD 94.01 m, not to scale</text>
</g>
</svg>