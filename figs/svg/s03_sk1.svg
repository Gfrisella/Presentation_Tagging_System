<text fill="#1c2330" font-size="16" text-anchor="middle" x="1302" y="88">T3</text><text fill="#1c2330" font-size="16" text-anchor="middle" x="1336" y="88">T4</text>
<text fill="#7b4fb0" font-size="16" text-anchor="middle" x="1260" y="226">0.65 Tm magnet</text>
<text fill="#1c2330" font-size="19" text-anchor="middle" x="1260" y="258">SST: Spectrometer Straw Tracker</text>
<!-- timing detector -->
